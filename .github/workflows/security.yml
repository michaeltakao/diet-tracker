name: Security Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly on Monday 09:00 UTC
    - cron: '0 9 * * 1'

permissions:
  contents: read

jobs:
  audit:
    name: npm audit
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        # --audit-level=high: fail on high/critical only, not on low/moderate
        # --omit=dev: gate on what ships. The full-tree audit below stays red on
        # braces (GHSA-vfj7-8cjw-p6xm, no patched release) via eslint-config-next.
        run: npm audit --omit=dev --audit-level=high

      - name: Audit all dependencies (informational)
        continue-on-error: true
        run: npm audit --audit-level=high

  secrets:
    name: gitleaks
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the scan covers the PR's commit range.
          fetch-depth: 0

      - name: Scan PR commits for secrets
        env:
          # Pinned release, verified by checksum before it runs. Bump both
          # together from the release's gitleaks_<version>_checksums.txt.
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${RUNNER_TEMP}/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          # Config (default rules + triaged allowlist) comes from the base
          # commit, so a PR cannot widen the allowlist for its own scan.
          git show "${BASE_SHA}:.gitleaks.toml" > "$RUNNER_TEMP/gitleaks.toml"
          # Exits 1 on a finding.
          "$RUNNER_TEMP/gitleaks" git --log-opts="${BASE_SHA}..${HEAD_SHA}" \
            --config "$RUNNER_TEMP/gitleaks.toml" --redact --no-banner --verbose
